name: macOS internal build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    # macos-15-intel is GitHub's hosted Intel x86_64 image.
    runs-on: macos-15-intel
    env:
      TARGET_TRIPLE: x86_64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      SKIP_UPDATER_SIGNING: "1"
      UV_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: false

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET_TRIPLE"
          rustup default stable

      - name: Cache uv, npm, and Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/uv
            ~/.npm
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-15-intel-${{ hashFiles('uv.lock', 'apps/terminal/package-lock.json', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: macos-15-intel-

      - name: Confirm native build host and deployment target
        run: |
          test "$(uname -m)" = x86_64
          test "$MACOSX_DEPLOYMENT_TARGET" = 11.0
          rustc -vV
          python -c 'import platform; assert platform.machine() == "x86_64"; print(platform.python_version(), platform.machine())'

      - name: Build unsigned app and DMG
        run: bash apps/desktop/scripts/build-macos.sh
        env:
          # CI has no updater key. This disables updater archives while keeping
          # the app and DMG build enabled.
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify architecture, minimum OS, bundle layout, and sidecar health
        shell: bash
        run: |
          bundle="apps/desktop/src-tauri/target/$TARGET_TRIPLE/release/bundle/macos"
          app="$(find "$bundle" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          dmg_bundle="apps/desktop/src-tauri/target/$TARGET_TRIPLE/release/bundle/dmg"
          dmg="$(find "$dmg_bundle" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          bash apps/desktop/scripts/verify-macos-bundle.sh --self-test
          bash apps/desktop/scripts/verify-macos-bundle.sh "$app" "$TARGET_TRIPLE"
          sidecar="$app/Contents/Resources/resources/sidecar/leviathan-desktop-$TARGET_TRIPLE"
          file "$sidecar"
          lipo -info "$sidecar"
          bash apps/desktop/scripts/smoke-macos-sidecar.sh "$sidecar"

      - name: Upload unsigned DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leviathan-macos-x86_64-dmg
          path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
