name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync workspace
        run: uv sync --locked --all-packages
      - name: Lint (ruff)
        run: uv run ruff check . --extend-exclude qa/integration-backups
      - name: Type-check (mypy strict)
        run: uv run mypy
      - name: Core tests
        run: uv run pytest -q packages/leviathan-core/tests
      - name: Store tests
        run: uv run pytest -q packages/leviathan-store/tests
      - name: Vault tests
        run: uv run pytest -q packages/leviathan-vault/tests
      - name: Market-data tests
        run: uv run pytest -q packages/leviathan-market-data/tests
      - name: API tests
        run: uv run pytest -q apps/api/tests

  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/terminal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/terminal/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npx tsc --noEmit
      - run: npm run build
