[project]
name = "leviathan-vault"
version = "0.1.0"
description = "Platform-protected runtime credential store and broker-backed key importer"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "keyring>=25.6,<26; sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leviathan_vault"]
