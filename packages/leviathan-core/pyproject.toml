[project]
name = "leviathan-core"
version = "0.1.0"
description = "LEVIATHAN AI core domain logic — schemas, state, truth, decision, risk, execution, journal. No I/O frameworks."
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py==4.2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leviathan_core"]
