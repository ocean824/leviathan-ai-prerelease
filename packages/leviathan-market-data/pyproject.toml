[project]
name = "leviathan-market-data"
version = "0.1.0"
description = "Bounded offline normalized market-data ingress contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "leviathan-vault", "databento-dbn==0.71.0; python_version < '3.15'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leviathan_market_data"]


