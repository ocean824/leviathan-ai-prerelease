[project]
name = "leviathan-store"
version = "0.1.0"
description = "LEVIATHAN AI persistence — async SQLAlchemy repositories for Layer-1 contracts. SQLite now, Postgres/TimescaleDB later."
requires-python = ">=3.11"
dependencies = [
    "leviathan-core",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
leviathan-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leviathan_store"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
