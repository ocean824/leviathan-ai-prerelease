# Copy to the application's data directory at market-data/paper-runtime.toml.
# This file contains configuration only. Provider credentials are resolved by
# the installed application's project-scoped vault bindings, never from TOML.
# Leave both feeds disabled until the operator confirms provider entitlements.

schema_version = 1
project_id = "leviathan-ai"
environment = "PAPER"

[databento]
enabled = false
dataset = "example-dataset"
stype_in = "raw_symbol"
schemas = ["trades"]
instruments = ["SYNTHETIC.SYMBOL"]

[massive]
enabled = false
dataset = "example-dataset"
stype_in = "raw_symbol"
schemas = ["trades"]
instruments = ["SYNTHETIC.SYMBOL"]

[backfill]
max_jobs = 4
max_records = 50000
max_window_ns = 2678400000000000
max_estimated_usd = "1.00"

[reconnect]
min_delay_ms = 250
max_delay_ms = 5000
max_attempts = 12

# Keyless public evidence adapters. FINRA OAuth credentials are resolved from
# the project vault at runtime and never stored in this settings file.
[public_sources]
enabled = false
sec_user_agent = "LeviathanAI/0.1 contact@example.invalid"
sec_requests_per_second = 5
http_timeout_seconds = 8
http_max_retries = 2
finra_enabled = false
cftc_enabled = false
treasury_enabled = false
nyfed_enabled = false
treasury_auctions_enabled = false
sec_ownership_filings_enabled = false
house_ptr_enabled = false
coinbase_derivatives_enabled = false
# Non-secret vault profile selector; FINRA_CLIENT_ID and FINRA_CLIENT_SECRET are resolved at runtime.
finra_credentials_profile = "DEFAULT"
