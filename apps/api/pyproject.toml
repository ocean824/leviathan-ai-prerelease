[project]
name = "leviathan-api"
version = "0.1.0"
description = "LEVIATHAN AI API gateway — webhook ingress, REST surface for the operator terminal."
requires-python = ">=3.11"
dependencies = [
    "leviathan-core",
    "leviathan-store",
    "leviathan-vault",
    "leviathan-market-data",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27,<1",
    "httpcore>=1.0.9,<2",
    "structlog>=24.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv.sources]
leviathan-core = { workspace = true }
leviathan-store = { workspace = true }
leviathan-vault = { workspace = true }
leviathan-market-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leviathan_api"]
