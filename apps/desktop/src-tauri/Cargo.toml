[package]
name = "leviathan-desktop-shell"
version = "0.1.0"
description = "Local desktop shell for Leviathan AI"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
serde_json = "=1.0.145"
url = "=2.5.8"

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-single-instance = { version = "=2.5.1" }
tauri-plugin-updater = { version = "=2.13.1" }
tauri-plugin-process = { version = "=2.3.1" }
getrandom = { version = "=0.3.4" }
semver = "=1.0.27"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
