[package]
name = "leviathan-admin-shell"
version = "0.1.0"
description = "Leviathan AI account administration"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-updater = { version = "=2.13.1" }
tauri-plugin-process = { version = "=2.3.1" }
getrandom = { version = "=0.3.4" }
serde_json = { version = "=1.0.151" }

[features]
custom-protocol = ["tauri/custom-protocol"]
